<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#143b34">
<title>Taller de problemas paso a paso · Matemáticas</title>
<style>
:root {
  font-family: Arial, "Liberation Sans", system-ui, sans-serif;
  color: #162e29;
  background: #f4f7f5;
  --ink: #162e29;
  --muted: #4c645e;
  --line: #d4e0dc;
  --navy: #143b34;
  --accent: #1d5799;
  --soft: #e6f0fc;
  --glow: #a6cbf2;
  --wash: #f2f7fe;
  --white: #ffffff;
  --good-bg: #e2f6ea;
  --good: #14532d;
  --warn-bg: #fff2e4;
  --warn: #8a3a0e;
  --hint-bg: #ebf3fc;
  --hint: #1d4373;
}
body[data-level="inicial"] {
  --navy: #1a3d6b;
  --accent: #1d5799;
  --soft: #e6f0fc;
  --glow: #a6cbf2;
  --wash: #f2f7fe;
}
body[data-level="3"] {
  --navy: #14402c;
  --accent: #176641;
  --soft: #e4f6ec;
  --glow: #a8dfc0;
  --wash: #f1fbf5;
}
body[data-level="4"] {
  --navy: #5c310d;
  --accent: #8c4810;
  --soft: #fff0d9;
  --glow: #f2c583;
  --wash: #fffaf0;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 280px; background: var(--wash); color: var(--ink); line-height: 1.5; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #1d64c2; outline-offset: 2px; }
[hidden] { display: none !important; }

.top {
  background: var(--navy);
  color: #fff;
}
.top-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 1.05rem;
}
.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: #e6f68f;
  color: #143b34;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 1.15rem;
}
.level-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.level-btn {
  border: 1px solid rgba(255,255,255,.32);
  background: rgba(255,255,255,.12);
  color: #fff;
  border-radius: 10px;
  padding: 8px 13px;
  min-height: 40px;
  font-weight: 700;
  font-size: .92rem;
}
.level-btn[data-pick="inicial"][aria-pressed="true"] {
  background: #cfe5ff;
  border-color: #cfe5ff;
  color: #133968;
}
.level-btn[data-pick="3"][aria-pressed="true"] {
  background: #c9f2d8;
  border-color: #c9f2d8;
  color: #12472b;
}
.level-btn[data-pick="4"][aria-pressed="true"] {
  background: #ffe0ae;
  border-color: #ffe0ae;
  color: #5c310d;
}

.wrap {
  max-width: 1060px;
  margin: 0 auto;
  padding: 22px 22px 44px;
}

/* Welcome / Level Picker */
.welcome-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: clamp(22px, 4vw, 38px);
  box-shadow: 0 10px 28px rgba(20,59,52,.07);
}
.welcome-card h1 {
  margin: 0 0 8px;
  font-size: clamp(1.7rem, 4vw, 2.5rem);
  letter-spacing: -.03em;
}
.welcome-lead {
  margin: 0 0 22px;
  color: var(--muted);
  font-size: 1.05rem;
  max-width: 66ch;
}
.level-cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.pick-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  padding: 18px;
  border-radius: 16px;
  border: 2px solid #9bc1ec;
  background: #eef5ff;
  color: #17457a;
  min-height: 138px;
}
.pick-card[data-level="3"] { border-color: #9cdab5; background: #edf9f1; color: #145334; }
.pick-card[data-level="4"] { border-color: #ecc07d; background: #fff6e6; color: #7a3d0d; }
.pick-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(20,59,52,.1); }
.pick-tag {
  display: inline-block;
  width: max-content;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(255,255,255,.8);
  font-size: .78rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.pick-card strong { font-size: 1.2rem; }
.pick-card span { font-size: .94rem; line-height: 1.4; }

/* Workspace */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.mode-switch {
  display: flex;
  gap: 6px;
  background: #e5eeeb;
  padding: 4px;
  border-radius: 12px;
}
.mode-btn {
  border: 0;
  background: transparent;
  color: var(--ink);
  border-radius: 9px;
  padding: 8px 14px;
  min-height: 40px;
  font-weight: 700;
  font-size: .93rem;
}
.mode-btn[aria-pressed="true"] {
  background: #fff;
  color: var(--accent);
  box-shadow: 0 1px 4px rgba(20,59,52,.12);
}
.score-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  border-radius: 12px;
  background: #fff;
  border: 1px solid var(--line);
  font-weight: 800;
  font-size: .92rem;
  color: var(--accent);
}

.sheet {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: clamp(18px, 3.5vw, 30px);
  box-shadow: 0 8px 24px rgba(20,59,52,.06);
}

.problem-card {
  background: var(--wash);
  border: 2px solid var(--glow);
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 20px;
}
.problem-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.problem-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 11px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--accent);
  font-size: .84rem;
  font-weight: 800;
}
.read-btn {
  border: 1px solid var(--glow);
  background: #fff;
  color: var(--accent);
  border-radius: 10px;
  padding: 6px 12px;
  min-height: 38px;
  font-weight: 700;
  font-size: .88rem;
}
.read-btn:hover { background: var(--soft); }
.problem-text {
  margin: 0;
  font-size: clamp(1.12rem, 2.3vw, 1.3rem);
  line-height: 1.65;
  text-align: left;
}
.problem-text p { margin: 0 0 6px; }
.problem-text p:last-child { margin-bottom: 0; }
.problem-question {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--glow);
  font-weight: 800;
  color: var(--navy);
  font-size: clamp(1.1rem, 2.2vw, 1.24rem);
}

/* Stepper */
.stepper {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 20px;
}
.step-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 11px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: #f8faf9;
  color: var(--muted);
  font-weight: 700;
  font-size: .88rem;
  text-align: left;
}
.step-num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #dce6e3;
  color: var(--ink);
  display: grid;
  place-items: center;
  font-size: .82rem;
  font-weight: 800;
  flex-shrink: 0;
}
.step-tab.active {
  border-color: var(--accent);
  background: var(--soft);
  color: var(--accent);
}
.step-tab.active .step-num {
  background: var(--accent);
  color: #fff;
}
.step-tab.done {
  border-color: #7cc99d;
  background: var(--good-bg);
  color: var(--good);
}
.step-tab.done .step-num {
  background: #1b7242;
  color: #fff;
}

.step-box {
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 18px 20px;
  background: #fff;
}
.step-title {
  margin: 0 0 6px;
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--navy);
}
.step-sub {
  margin: 0 0 14px;
  font-size: .95rem;
  color: var(--muted);
}

/* Step 1: Data chips */
.chip-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.data-chip {
  min-height: 48px;
  padding: 10px 15px;
  border-radius: 12px;
  border: 2px solid #c3d5cf;
  background: #fff;
  color: var(--ink);
  font-weight: 700;
  font-size: 1rem;
  text-align: left;
}
.data-chip:hover:not(:disabled) { background: var(--wash); border-color: var(--accent); }
.data-chip[aria-pressed="true"] {
  background: var(--soft);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.data-chip.is-right { background: var(--good-bg); border-color: #217346; color: var(--good); }
.data-chip.is-wrong { background: var(--warn-bg); border-color: #c2571a; color: var(--warn); }

/* Step 2: Bar model visual diagram */
.scheme-box {
  margin: 0 0 16px;
  padding: 16px;
  border-radius: 14px;
  background: #f8fbfa;
  border: 1.5px solid var(--line);
}
.scheme-caption {
  font-size: .85rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  margin-bottom: 10px;
}
.bar-model {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 560px;
}
.bar-total {
  padding: 9px 12px;
  border-radius: 10px;
  border: 2px solid #143b34;
  background: #e6f2ef;
  text-align: center;
  font-weight: 800;
  font-size: 1rem;
  color: #143b34;
}
.bar-parts {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.bar-part {
  flex: 1 1 80px;
  padding: 10px 8px;
  border-radius: 10px;
  border: 2px solid #2c7a68;
  background: #fff;
  text-align: center;
  font-weight: 800;
  font-size: .96rem;
}
.bar-part.unknown {
  border-style: dashed;
  border-color: #b45309;
  background: #fff7e6;
  color: #92400e;
}
.bar-total.unknown {
  border-style: dashed;
  border-color: #b45309;
  background: #fff7e6;
  color: #92400e;
}
.bar-part.removed {
  border-color: #c2571a;
  background: #fff1e8;
  color: #8a3a0e;
}

.op-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}
.op-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 64px;
  padding: 10px 12px;
  border-radius: 13px;
  border: 2px solid #c3d5cf;
  background: #fff;
  color: var(--ink);
  font-weight: 800;
  font-size: 1rem;
}
.op-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--wash); }
.op-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); color: var(--accent); }
.op-btn.is-right { background: var(--good-bg); border-color: #217346; color: var(--good); }
.op-btn.is-wrong { background: var(--warn-bg); border-color: #c2571a; color: var(--warn); }
.op-symbol { font-size: 1.35rem; line-height: 1.1; }
.op-desc { font-size: .82rem; font-weight: 700; color: var(--muted); }

/* Step 3: Calculation + keypad */
.calc-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 210px;
  gap: 18px;
  align-items: start;
}
.calc-stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.eq-card {
  padding: 14px 16px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: #f9fbfa;
}
.eq-label {
  font-size: .85rem;
  font-weight: 800;
  color: var(--muted);
  margin-bottom: 6px;
}
.eq-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 1.25rem;
  font-weight: 800;
}
.num-input {
  width: 140px;
  min-height: 50px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 2px solid #9eb8b1;
  background: #fff;
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--ink);
}
.num-input.active { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(24,102,85,.15); }
.num-input.is-right { background: var(--good-bg); border-color: #217346; }
.num-input.is-wrong { background: var(--warn-bg); border-color: #c2571a; }

.keypad {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  padding: 10px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #eaf1ee;
}
.kp-btn {
  min-height: 46px;
  border-radius: 9px;
  border: 1px solid #b5cbc4;
  background: #fff;
  color: var(--ink);
  font-size: 1.18rem;
  font-weight: 800;
  touch-action: manipulation;
}
.kp-btn:hover { background: var(--soft); border-color: var(--accent); }
.kp-btn.util { background: #d8e5e0; font-size: .95rem; }

/* Step 4: Sentence starter */
.starter-box {
  padding: 16px 18px;
  border-radius: 14px;
  background: var(--wash);
  border: 2px solid var(--glow);
  font-size: 1.15rem;
  font-weight: 800;
  margin-bottom: 14px;
}
.unit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
}

/* Actions, feedback, hints */
.actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.btn {
  min-height: 46px;
  padding: 10px 16px;
  border-radius: 11px;
  border: 1.5px solid #bfd2cc;
  background: #fff;
  color: var(--ink);
  font-weight: 800;
  font-size: .96rem;
}
.btn:hover:not(:disabled) { background: #eef5f2; }
.btn-primary {
  background: var(--navy);
  border-color: var(--navy);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { background: #1e5248; }

.feedback:not(:empty),
.hint:not(:empty) {
  margin-top: 13px;
  padding: 11px 14px;
  border-radius: 11px;
  font-size: .98rem;
  font-weight: 700;
  line-height: 1.45;
}
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.try { background: var(--warn-bg); color: var(--warn); }
.hint { background: var(--hint-bg); color: var(--hint); }

.checklist {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #f4faf6;
  border: 1px solid #bfe2cd;
  font-size: .92rem;
  color: #164e31;
}
.checklist strong { display: block; margin-bottom: 4px; }

@media (max-width: 780px) {
  .level-cards { grid-template-columns: 1fr; }
  .stepper { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .calc-layout { grid-template-columns: 1fr; }
  .keypad { max-width: 260px; }
}
</style>
</head>
<body data-level="3">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">?</span>
        <span>Taller de problemas paso a paso</span>
      </div>
      <div class="level-pills" role="group" aria-label="Elegir nivel">
        <button class="level-btn" type="button" data-pick="inicial" aria-pressed="false">Nivel inicial</button>
        <button class="level-btn" type="button" data-pick="3" aria-pressed="false">3.º Primaria</button>
        <button class="level-btn" type="button" data-pick="4" aria-pressed="false">4.º Primaria</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="welcomeView" class="welcome-card">
      <h1>Resuelve problemas paso a paso</h1>
      <p class="welcome-lead">Lee despacio, selecciona los datos importantes, observa el esquema visual y calcula la solución sin prisas.</p>
      <div class="level-cards">
        <button class="pick-card" type="button" data-level="inicial">
          <span class="pick-tag">1 operación · lectura fácil</span>
          <strong>Nivel inicial</strong>
          <span>Frases cortas (una idea por línea), sumas y restas directas con esquema visual guiado.</span>
        </button>
        <button class="pick-card" type="button" data-level="3">
          <span class="pick-tag">3.º de Primaria</span>
          <strong>3.º Primaria</strong>
          <span>Sumas y restas con llevadas, grupos iguales, dinero en euros y detección de datos clave.</span>
        </button>
        <button class="pick-card" type="button" data-level="4">
          <span class="pick-tag">4.º de Primaria</span>
          <strong>4.º Primaria</strong>
          <span>Multiplicaciones, repartos exactos, doble/mitad y problemas de 2 pasos encadenados.</span>
        </button>
      </div>
    </section>

    <section id="workView" hidden>
      <div class="toolbar">
        <div class="mode-switch" role="group" aria-label="Modo de resolución">
          <button class="mode-btn" id="modeGuidedBtn" type="button" aria-pressed="true">Paso a paso (4 pasos)</button>
          <button class="mode-btn" id="modeDirectBtn" type="button" aria-pressed="false">Modo directo</button>
        </div>
        <div class="score-pill">
          <span id="progressText">Problema #1</span>
          <span>·</span>
          <span id="solvedText">0 resueltos</span>
        </div>
      </div>

      <article class="sheet">
        <div class="problem-card" data-aula-read>
          <div class="problem-head">
            <span class="problem-badge" id="problemTag">3.º Primaria</span>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="read-btn" id="speakProblemBtn" type="button">🔊 Escuchar problema</button>
              <button class="read-btn" id="newProblemBtn" type="button" title="Generar otro problema con números nuevos">🎲 Otro problema</button>
            </div>
          </div>
          <div class="problem-text" id="problemLines"></div>
          <div class="problem-question" id="problemQuestion"></div>
        </div>

        <nav class="stepper" id="stepper" aria-label="Pasos del problema">
          <div class="step-tab" data-step="1"><span class="step-num">1</span><span>Datos clave</span></div>
          <div class="step-tab" data-step="2"><span class="step-num">2</span><span>Esquema y operación</span></div>
          <div class="step-tab" data-step="3"><span class="step-num">3</span><span>Calcula</span></div>
          <div class="step-tab" data-step="4"><span class="step-num">4</span><span>Solución</span></div>
        </nav>

        <div id="stepArea" class="step-box"></div>
        <div id="feedbackBox" class="feedback" role="status" aria-live="polite"></div>
        <div id="hintBox" class="hint" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <script src="/registro.js"></script>
  <script>
  (() => {
    'use strict';

    const NAMES = ['Vera', 'Hugo', 'Nora', 'Lucía', 'Mateo', 'Sofía', 'Valeria', 'Leo', 'Martina', 'Daniel'];
    const PLACES = ['Alhama', 'Calatayud', 'Zaragoza', 'Huesca', 'Teruel'];

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pickOne(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function pickTwoNames() {
      const a = pickOne(NAMES);
      let b = pickOne(NAMES);
      while (b === a) b = pickOne(NAMES);
      return [a, b];
    }

    // Nivel inicial: 2-digit addition with NO carry (u1+u2 <= 9, d1+d2 <= 9)
    function pickNoCarryAdd() {
      const d1 = randInt(1, 5);
      const d2 = randInt(1, 8 - d1);
      const u1 = randInt(1, 7);
      const u2 = randInt(1, 9 - u1);
      return [d1 * 10 + u1, d2 * 10 + u2];
    }

    // Nivel inicial: 2-digit subtraction with NO borrowing (u1 >= u2, d1 > d2)
    function pickNoBorrowSub() {
      const d1 = randInt(2, 7);
      const d2 = randInt(1, d1 - 1);
      const u1 = randInt(2, 9);
      const u2 = randInt(1, u1 - 1);
      return [d1 * 10 + u1, d2 * 10 + u2];
    }

    // 3.º: 3-digit addition guaranteed to have at least one carry
    function pickCarryAdd(minA = 125, maxA = 485, minB = 115, maxB = 385) {
      for (let i = 0; i < 60; i++) {
        const a = randInt(minA, maxA);
        const b = randInt(minB, maxB);

              { label: `Paso 2: Repartimos en bolsas de ${bagKg} kg`, expr: `${total} ÷ ${bagKg} =`, ans: bags }
            ],

            ],

              { text: `${n} entradas`, useful: true },

            ],

              { val: '× y −', sym: '× y −', desc: 'Multiplicar y luego restar' },

            ],

              { label: `Paso 1: ¿Cuánto cuestan las ${n} entradas?`, expr: `${n} × ${price} =`, ans: cost },
              { label: `Paso 2: ¿Cuánto le devuelven de ${bill} €?`, expr: `${bill} − ${cost} =`, ans: change }
            ],
            answer: change,
            starter: 'SOLUCIÓN: Le devuelven de cambio ___',

            unitOptions: [`${change} euros`, `${change} minutos`, `${change} años`],
            hint1: `La edad (${age} años) y la duración (${mins} minutos) no aportan nada para calcular el cambio.`,
            hint2: `Paso 1: ${n} × ${price} = ${cost} €. Paso 2: ${bill} − ${cost} = ${change} €.`
          };
        }
      ]
    };

    function mutateNumberChip(text, forbiddenNums) {
      const m = text.match(/(\d+)/);
      if (!m) return null;
      const orig = Number(m[1]);
      const deltas = orig >= 100
        ? [10, -10, 20, -20, 5, -5, 12]
        : (orig >= 20 ? [5, -5, 10, -10, 3, -3, 4] : [2, 3, -2, 4, 5, 1]);
      for (const d of shuffle(deltas)) {
        const fake = orig + d;
        if (fake >= 2 && fake !== orig && !forbiddenNums.has(fake)) {
          forbiddenNums.add(fake);
          return text.replace(m[1], String(fake));
        }
      }
      return null;
    }

    function enrichChips(problem, lvl) {
      const plain = problem.lines.map(l => l.replace(/<[^>]+>/g, '')).join(' ') + ' ' + problem.question;
      const forbidden = new Set((plain.match(/\d+/g) || []).map(Number));
      const chips = problem.chips.map(c => ({ ...c }));
      const usefulChips = chips.filter(c => c.useful);
      const existingFalse = chips.filter(c => !c.useful).length;

      // Always add at least 1 plausible false numerical option (altered number not in text)
      const targetFakeCount = lvl === 'inicial' ? 1 : (existingFalse >= 2 ? 1 : 2);
      let added = 0;
      for (const uc of shuffle(usefulChips)) {
        if (added >= targetFakeCount) break;
        const fakeText = mutateNumberChip(uc.text, forbidden);
        if (fakeText && !chips.some(c => c.text === fakeText)) {
          chips.push({ text: fakeText, useful: false, invented: true });
          added++;
        }
      }

      problem.chips = shuffle(chips);
      return problem;
    }

    function generateDeck(lvl) {
      return shuffle(PROBLEM_GENERATORS[lvl]).map(fn => enrichChips(fn(), lvl));
    }

    const LEVEL_LABELS = {
      inicial: 'Nivel inicial',
      '3': '3.º Primaria',
      '4': '4.º Primaria'
    };

    const $ = id => document.getElementById(id);
    const Aula = window.Aula || {
      begin() {}, activate() {}, attempt() {}, hint() {}, reveal() {}
    };

    let currentLevel = null;
    let guidedMode = true;
    let deck = [];
    let index = 0;
    let totalShown = 0;
    let solvedCount = 0;
    let currentStep = 1; // 1..4 in guided mode
    let selectedChips = new Set();
    let selectedOp = null;
    let stepInputs = [];
    let activeInputIdx = 0;
    let hintLevel = 0;
    let problemSolved = false;
    let showDirectScheme = false;

    function aulaMode() {
      return guidedMode ? 'Paso a paso' : 'Directo';
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function plainTextProblem(p) {
      const stripped = p.lines.map(l => l.replace(/<[^>]+>/g, '')).join(' ');
      return `${stripped} ${p.question}`;
    }

    function setFeedback(text, kind = '') {
      const el = $('feedbackBox');
      el.textContent = text;
      el.className = kind ? `feedback ${kind}` : 'feedback';
    }

    function setHint(text) {
      $('hintBox').textContent = text;
    }

    function speakText(text) {
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-ES';
        u.rate = 0.94;
        window.speechSynthesis.speak(u);
      } catch {}
    }

    function selectLevel(lvl) {
      currentLevel = lvl;
      document.body.dataset.level = lvl;
      document.querySelectorAll('.level-btn').forEach(b => {
        b.setAttribute('aria-pressed', String(b.dataset.pick === lvl));
      });
      $('welcomeView').hidden = true;
      $('workView').hidden = false;
      deck = generateDeck(lvl);
      index = 0;
      totalShown = 1;
      solvedCount = 0;
      Aula.activate(aulaMode());
      loadProblem();
    }

    function currentProblem() {
      return deck[index % deck.length];
    }

    function loadProblem() {
      const p = currentProblem();
      currentStep = 1;
      selectedChips = new Set();
      selectedOp = null;
      stepInputs = p.steps.map(() => '');
      activeInputIdx = 0;
      hintLevel = 0;
      problemSolved = false;
      showDirectScheme = false;

      $('problemTag').textContent = `${p.hard ? '★ ' : ''}${LEVEL_LABELS[currentLevel]} · ${p.topic}`;
      $('problemLines').innerHTML = p.lines.map(l => `<p>${l}</p>`).join('');
      $('problemQuestion').textContent = p.question;
      $('progressText').textContent = `Problema #${totalShown}`;
      $('solvedText').textContent = `${solvedCount} ${solvedCount === 1 ? 'resuelto' : 'resueltos'}`;
      $('stepper').hidden = !guidedMode;

      setFeedback('');
      setHint('');

      Aula.begin(aulaMode(), `${p.topic}: ${plainTextProblem(p)}`, LEVEL_LABELS[currentLevel]);

      renderStep();
    }

    function updateStepper() {
      document.querySelectorAll('.step-tab').forEach(tab => {
        const s = Number(tab.dataset.step);
        tab.classList.remove('active', 'done');
        if (problemSolved || s < currentStep) tab.classList.add('done');
        else if (s === currentStep) tab.classList.add('active');
      });
    }

    function renderSchemeHtml(scheme) {
      if (scheme.type === 'add') {
        return `
          <div class="scheme-box">
            <div class="scheme-caption">Esquema visual · Juntar partes</div>
            <div class="bar-model">
              <div class="bar-total unknown">${escapeHtml(scheme.total)}</div>
              <div class="bar-parts">
                ${scheme.parts.map(pt => `<div class="bar-part">${escapeHtml(pt)}</div>`).join('')}
              </div>
            </div>
          </div>`;
      }
      if (scheme.type === 'sub') {
        return `
          <div class="scheme-box">
            <div class="scheme-caption">Esquema visual · Total y partes</div>
            <div class="bar-model">
              <div class="bar-total">${escapeHtml(scheme.total)}</div>
              <div class="bar-parts">
                <div class="bar-part removed">${escapeHtml(scheme.taken)}</div>
                <div class="bar-part unknown">${escapeHtml(scheme.left)}</div>
              </div>
            </div>
          </div>`;
      }
      if (scheme.type === 'mul') {
        const visualCount = Math.min(scheme.groups, 6);
        const extra = scheme.groups > 6 ? `<div class="bar-part">… (${scheme.groups} grupos)</div>` : '';
        return `
          <div class="scheme-box">
            <div class="scheme-caption">Esquema visual · ${scheme.groups} grupos iguales</div>
            <div class="bar-model">
              <div class="bar-total unknown">${escapeHtml(scheme.total)}</div>
              <div class="bar-parts">
                ${Array.from({ length: visualCount }, () => `<div class="bar-part">${escapeHtml(scheme.each)}</div>`).join('')}
                ${extra}
              </div>
            </div>
          </div>`;
      }
      if (scheme.type === 'div') {
        const visualCount = Math.min(scheme.groups, 6);
        const extra = scheme.groups > 6 ? `<div class="bar-part unknown">… (${scheme.groups} partes)</div>` : '';
        return `
          <div class="scheme-box">
            <div class="scheme-caption">Esquema visual · Repartir en ${scheme.groups} partes iguales</div>
            <div class="bar-model">
              <div class="bar-total">${escapeHtml(scheme.total)}</div>
              <div class="bar-parts">
                ${Array.from({ length: visualCount }, () => `<div class="bar-part unknown">${escapeHtml(scheme.each)}</div>`).join('')}
                ${extra}
              </div>
            </div>
          </div>`;
      }
      return `
        <div class="scheme-box">
          <div class="scheme-caption">Esquema visual · Problema de 2 pasos</div>
          <div class="bar-model">
            <div class="bar-part">${escapeHtml(scheme.stepA)}</div>
            <div class="bar-part unknown">${escapeHtml(scheme.stepB)}</div>
          </div>
        </div>`;
    }

    function renderKeypadHtml() {
      const keys = ['7','8','9','4','5','6','1','2','3','C','0','⌫'];
      return `
        <div class="keypad" aria-label="Teclado numérico">
          ${keys.map(k => `<button type="button" class="kp-btn ${k === 'C' || k === '⌫' ? 'util' : ''}" data-kp="${k}">${k}</button>`).join('')}
        </div>`;
    }

    function wireKeypad(container) {
      container.querySelectorAll('[data-kp]').forEach(btn => {
        btn.addEventListener('click', () => {
          const k = btn.dataset.kp;
          const inputs = [...container.querySelectorAll('.num-input')];
          const inp = inputs[activeInputIdx] || inputs[0];
          if (!inp || inp.readOnly) return;
          if (k === 'C') inp.value = '';
          else if (k === '⌫') inp.value = inp.value.slice(0, -1);
          else if (inp.value.length < 5) inp.value += k;
          stepInputs[activeInputIdx] = inp.value;
          inp.focus();
        });
      });
    }

    function renderStep() {
      const p = currentProblem();
      const box = $('stepArea');
      if (!guidedMode) {
        renderDirectMode(p, box);
        return;
      }
      updateStepper();

      if (currentStep === 1) {
        box.innerHTML = `
          <h2 class="step-title">Paso 1 · Selecciona los datos clave</h2>
          <p class="step-sub">Toca solo los datos verdaderos que necesitas para responder. ¡Cuidado: hay opciones falsas y datos que sobran!</p>
          <div class="chip-grid" id="chipGrid">
            ${p.chips.map((c, i) => `
              <button type="button" class="data-chip" data-chip="${i}" aria-pressed="${selectedChips.has(i)}">${escapeHtml(c.text)}</button>
            `).join('')}
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary" id="checkStep1Btn">Comprobar datos</button>
            <button type="button" class="btn" id="hintStepBtn">💡 Pista</button>
          </div>
        `;
        box.querySelectorAll('[data-chip]').forEach(btn => {
          btn.addEventListener('click', () => {
            const i = Number(btn.dataset.chip);
            if (selectedChips.has(i)) selectedChips.delete(i);
            else selectedChips.add(i);
            btn.setAttribute('aria-pressed', String(selectedChips.has(i)));
            btn.classList.remove('is-wrong', 'is-right');
          });
        });
        $('checkStep1Btn').addEventListener('click', () => {
          const expected = p.chips.map((c, i) => c.useful ? i : -1).filter(i => i >= 0);
          const chosen = [...selectedChips].sort((a, b) => a - b);
          const ok = expected.length === chosen.length && expected.every((v, idx) => v === chosen[idx]);
          box.querySelectorAll('[data-chip]').forEach(btn => {
            const i = Number(btn.dataset.chip);
            const isSel = selectedChips.has(i);
            btn.classList.remove('is-right', 'is-wrong');
            if (isSel && p.chips[i].useful) btn.classList.add('is-right');
            else if (isSel && !p.chips[i].useful) btn.classList.add('is-wrong');
          });
          if (ok) {
            setFeedback('¡Genial! Has seleccionado exactamente los datos verdaderos y necesarios.', 'good');
            setHint('');
            currentStep = 2;
            setTimeout(() => { setFeedback(''); renderStep(); }, 650);
          } else {
            const inventedPicked = chosen.filter(i => p.chips[i].invented).length;
            const uselessPicked = chosen.filter(i => !p.chips[i].useful && !p.chips[i].invented).length;
            const msg = inventedPicked > 0
              ? '¡Ojo! Has marcado alguna opción falsa cuyo número no aparece en el problema. Vuelve a leer el enunciado.'
              : uselessPicked > 0
                ? 'Has marcado algún dato del enunciado que no aporta nada para responder a la pregunta.'
                : `Te falta marcar algún dato importante (en este problema hay ${expected.length} datos clave).`;
            setFeedback(msg, 'try');
          }
        });
        $('hintStepBtn').addEventListener('click', () => {
          const useful = p.chips.filter(c => c.useful).map(c => c.text).join(' · ');
          Aula.hint(aulaMode());
          setHint(`Fíjate en los números que responden a la pregunta: ${useful}.`);
        });
        return;
      }

      if (currentStep === 2) {
        box.innerHTML = `
          <h2 class="step-title">Paso 2 · Observa el esquema y elige la operación</h2>
          <p class="step-sub">Mira el dibujo del problema y decide qué operación te permite resolverlo.</p>
          ${renderSchemeHtml(p.scheme)}
          <div class="op-grid" id="opGrid">
            ${p.opOptions.map(o => `
              <button type="button" class="op-btn" data-op="${escapeHtml(o.val)}" aria-pressed="${selectedOp === o.val}">
                <span class="op-symbol">${escapeHtml(o.sym)}</span>
                <span class="op-desc">${escapeHtml(o.desc)}</span>
              </button>
            `).join('')}
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary" id="checkStep2Btn">Comprobar operación</button>
            <button type="button" class="btn" id="hintStepBtn">💡 Pista</button>
          </div>
        `;
        box.querySelectorAll('[data-op]').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedOp = btn.dataset.op;
            box.querySelectorAll('[data-op]').forEach(b => {
              b.setAttribute('aria-pressed', String(b === btn));
              b.classList.remove('is-wrong', 'is-right');
            });
          });
        });
        $('checkStep2Btn').addEventListener('click', () => {
          if (!selectedOp) {
            setFeedback('Elige primero una operación.', 'try');
            return;
          }
          const ok = selectedOp === p.op;
          box.querySelectorAll('[data-op]').forEach(b => {
            if (b.dataset.op === selectedOp) b.classList.add(ok ? 'is-right' : 'is-wrong');
          });
          if (ok) {
            setFeedback('¡Exacto! Esa es la operación que resuelve el problema.', 'good');
            setHint('');
            currentStep = 3;
            setTimeout(() => { setFeedback(''); renderStep(); }, 650);
          } else {
            Aula.attempt(aulaMode(), false, `Operación: ${selectedOp}`);
            setFeedback('Piensa si el resultado debe ser mayor o menor y observa las partes del esquema.', 'try');
          }
        });
        $('hintStepBtn').addEventListener('click', () => {
          Aula.hint(aulaMode());
          setHint(p.hint1);
        });
        return;
      }

      if (currentStep === 3) {
        box.innerHTML = `
          <h2 class="step-title">Paso 3 · Calcula el resultado</h2>
          <p class="step-sub">Escribe la respuesta usando el teclado o los botones numéricos.</p>
          ${renderSchemeHtml(p.scheme)}
          <div class="calc-layout">
            <div class="calc-stack">
              ${p.steps.map((st, idx) => `
                <div class="eq-card">
                  <div class="eq-label">${escapeHtml(st.label)}</div>
                  <div class="eq-row">
                    <span>${escapeHtml(st.expr)}</span>
                    <input type="text" inputmode="numeric" class="num-input ${idx === activeInputIdx ? 'active' : ''}" data-step-input="${idx}" value="${escapeHtml(stepInputs[idx] || '')}" aria-label="${escapeHtml(st.label)}">
                  </div>
                </div>
              `).join('')}
            </div>
            ${renderKeypadHtml()}
          </div>
          <div class="actions">
            <button type="button" class="btn btn-primary" id="checkStep3Btn">Comprobar cálculo</button>
            <button type="button" class="btn" id="hintStepBtn">💡 Pista</button>
            <button type="button" class="btn" id="revealStepBtn">Ver solución</button>
          </div>
        `;
        const inputs = [...box.querySelectorAll('.num-input')];
        inputs.forEach((inp, idx) => {
          inp.addEventListener('focus', () => {
            activeInputIdx = idx;
            inputs.forEach((el, j) => el.classList.toggle('active', j === idx));
          });
          inp.addEventListener('input', () => {
            inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 5);
            stepInputs[idx] = inp.value;
            inp.classList.remove('is-wrong', 'is-right');
          });
          inp.addEventListener('keydown', e => {
            if (e.key === 'Enter') $('checkStep3Btn').click();
          });
        });
        wireKeypad(box);
        if (inputs[0]) inputs[0].focus();

        $('checkStep3Btn').addEventListener('click', () => {
          let allFilled = true;
          let allOk = true;
          inputs.forEach((inp, idx) => {
            const val = inp.value.trim();
            if (!val) allFilled = false;
            const ok = Number(val) === p.steps[idx].ans;
            inp.classList.remove('is-right', 'is-wrong');
            if (val) inp.classList.add(ok ? 'is-right' : 'is-wrong');
            if (!ok) allOk = false;
          });
          if (!allFilled) {
            setFeedback('Completa el cálculo antes de comprobar.', 'try');
            return;
          }
          const finalVal = inputs[inputs.length - 1].value.trim();
          Aula.attempt(aulaMode(), allOk, finalVal);
          if (allOk) {
            setFeedback('¡Cálculo perfecto! Vamos al último paso para escribir la solución completa.', 'good');
            setHint('');
            currentStep = 4;
            setTimeout(() => { setFeedback(''); renderStep(); }, 650);
          } else {
            setFeedback('Revisa la operación marcada en naranja. Puedes usar una pista si la necesitas.', 'try');
          }
        });

        $('hintStepBtn').addEventListener('click', () => {
          hintLevel++;
          const txt = hintLevel === 1 ? p.hint1 : p.hint2;
          Aula.hint(aulaMode());
          setHint(txt);
        });

        $('revealStepBtn').addEventListener('click', () => {
          inputs.forEach((inp, idx) => {
            inp.value = String(p.steps[idx].ans);
            stepInputs[idx] = inp.value;
            inp.classList.remove('is-wrong');
            inp.classList.add('is-right');
          });
          Aula.reveal(aulaMode());
          setHint(`Solución paso a paso: ${p.steps.map(s => `${s.expr} ${s.ans}`).join(' · ')}`);
          setFeedback('Solución mostrada. Pulsa «Comprobar cálculo» para pasar a la frase final o ve al siguiente problema.', 'try');
        });
        return;
      }

      // Step 4: Sentence starter & unit verification
      const opts = shuffle(p.unitOptions);
      box.innerHTML = `
        <h2 class="step-title">Paso 4 · Completa la solución</h2>
        <p class="step-sub">Elige la respuesta con las palabras correctas para contestar a la pregunta.</p>
        <div class="starter-box" id="starterPreview">${escapeHtml(p.starter)}</div>
        <div class="unit-grid">
          ${opts.map(u => `<button type="button" class="data-chip" data-unit="${escapeHtml(u)}">${escapeHtml(u)}</button>`).join('')}
        </div>
        <div id="doneChecklist" class="checklist" hidden>
          <strong>✓ Problema completado</strong>
          □ He elegido los datos útiles · □ He usado el esquema y la operación · □ He comprobado el resultado con su unidad.
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="nextProblemBtn" hidden>Siguiente problema →</button>
        </div>
      `;
      box.querySelectorAll('[data-unit]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (problemSolved) return;
          const chosen = btn.dataset.unit;
          const ok = chosen === p.unitCorrect;
          btn.classList.add(ok ? 'is-right' : 'is-wrong');
          if (ok) {
            problemSolved = true;
            solvedCount++;
            $('solvedText').textContent = `${solvedCount} ${solvedCount === 1 ? 'resuelto' : 'resueltos'}`;
            $('starterPreview').textContent = p.starter.replace('___', chosen) + '.';
            $('doneChecklist').hidden = false;
            $('nextProblemBtn').hidden = false;
            updateStepper();
            setFeedback('¡Enhorabuena! Has resuelto todo el problema paso a paso.', 'good');
            box.querySelectorAll('[data-unit]').forEach(b => { b.disabled = true; });
          } else {
            setFeedback('Fíjate bien en qué pregunta el problema para elegir la unidad correcta.', 'try');
          }
        });
      });
      $('nextProblemBtn').addEventListener('click', goNextProblem);
    }

    function renderDirectMode(p, box) {
      box.innerHTML = `
        <h2 class="step-title">Resuelve directamente</h2>
        <p class="step-sub">Elige la operación y escribe el resultado final.</p>
        ${showDirectScheme ? renderSchemeHtml(p.scheme) : ''}
        <div class="op-grid" style="margin-bottom:16px;">
          ${p.opOptions.map(o => `
            <button type="button" class="op-btn" data-op="${escapeHtml(o.val)}" aria-pressed="${selectedOp === o.val}">
              <span class="op-symbol">${escapeHtml(o.sym)}</span>
              <span class="op-desc">${escapeHtml(o.desc)}</span>
            </button>
          `).join('')}
        </div>
        <div class="calc-layout">
          <div class="calc-stack">
            <div class="eq-card">
              <div class="eq-label">Resultado final (${escapeHtml(p.unitCorrect.replace(/^\d+\s*/, ''))})</div>
              <div class="eq-row">
                <input type="text" inputmode="numeric" class="num-input active" id="directInput" value="${escapeHtml(stepInputs[0] || '')}" aria-label="Resultado final">
              </div>
            </div>
          </div>
          ${renderKeypadHtml()}
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="checkDirectBtn">Comprobar</button>
          <button type="button" class="btn" id="toggleSchemeBtn">${showDirectScheme ? 'Ocultar esquema' : 'Ver esquema visual'}</button>
          <button type="button" class="btn" id="hintDirectBtn">💡 Pista</button>
          <button type="button" class="btn" id="revealDirectBtn">Ver solución</button>
          <button type="button" class="btn btn-primary" id="nextDirectBtn" ${problemSolved ? '' : 'hidden'}>Siguiente problema →</button>
        </div>
      `;
      activeInputIdx = 0;
      const inp = $('directInput');
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 5);
        stepInputs[0] = inp.value;
        inp.classList.remove('is-wrong', 'is-right');
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') $('checkDirectBtn').click();
      });
      wireKeypad(box);
      box.querySelectorAll('[data-op]').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedOp = btn.dataset.op;
          box.querySelectorAll('[data-op]').forEach(b => {
            b.setAttribute('aria-pressed', String(b === btn));
            b.classList.remove('is-wrong', 'is-right');
          });
        });
      });
      $('toggleSchemeBtn').addEventListener('click', () => {
        showDirectScheme = !showDirectScheme;
        renderStep();
      });
      $('hintDirectBtn').addEventListener('click', () => {
        hintLevel++;
        const txt = hintLevel === 1 ? p.hint1 : p.hint2;
        Aula.hint(aulaMode());
        setHint(txt);
      });
      $('revealDirectBtn').addEventListener('click', () => {
        selectedOp = p.op;
        inp.value = String(p.answer);
        stepInputs[0] = inp.value;
        Aula.reveal(aulaMode());
        setHint(`Solución: ${p.steps.map(s => `${s.expr} ${s.ans}`).join(' · ')} (${p.unitCorrect}).`);
        $('nextDirectBtn').hidden = false;
      });
      $('checkDirectBtn').addEventListener('click', () => {
        const val = inp.value.trim();
        if (!val) {
          setFeedback('Escribe el resultado antes de comprobar.', 'try');
          return;
        }
        const opOk = !selectedOp || selectedOp === p.op;
        const numOk = Number(val) === p.answer;
        const ok = opOk && numOk;
        Aula.attempt(aulaMode(), ok, `${selectedOp || ''} = ${val}`.trim());
        inp.classList.add(numOk ? 'is-right' : 'is-wrong');
        if (ok) {
          if (!problemSolved) {
            problemSolved = true;
            solvedCount++;
            $('solvedText').textContent = `${solvedCount} ${solvedCount === 1 ? 'resuelto' : 'resueltos'}`;
          }
          setFeedback(`¡Correcto! ${p.starter.replace('___', p.unitCorrect)}.`, 'good');
          $('nextDirectBtn').hidden = false;
        } else if (!opOk) {
          setFeedback('Revisa la operación elegida. Puedes pulsar «Ver esquema visual» para ayudarte.', 'try');
        } else {
          setFeedback('Ese resultado no coincide todavía. Repasa el cálculo o pide una pista.', 'try');
        }
      });
      $('nextDirectBtn').addEventListener('click', goNextProblem);
      inp.focus();
    }

    function goNextProblem() {
      index++;
      totalShown++;
      if (index >= deck.length) {
        deck = generateDeck(currentLevel);
        index = 0;
      }
      loadProblem();
    }

    document.querySelectorAll('.pick-card').forEach(btn => {
      btn.addEventListener('click', () => selectLevel(btn.dataset.level));
    });
    document.querySelectorAll('.level-btn').forEach(btn => {
      btn.addEventListener('click', () => selectLevel(btn.dataset.pick));
    });
    $('modeGuidedBtn').addEventListener('click', () => {
      if (guidedMode) return;
      guidedMode = true;
      $('modeGuidedBtn').setAttribute('aria-pressed', 'true');
      $('modeDirectBtn').setAttribute('aria-pressed', 'false');
      Aula.activate('Paso a paso');
      loadProblem();
    });
    $('modeDirectBtn').addEventListener('click', () => {
      if (!guidedMode) return;
      guidedMode = false;
      $('modeGuidedBtn').setAttribute('aria-pressed', 'false');
      $('modeDirectBtn').setAttribute('aria-pressed', 'true');
      Aula.activate('Directo');
      loadProblem();
    });
    $('speakProblemBtn').addEventListener('click', () => {
      if (!currentLevel) return;
      speakText(plainTextProblem(currentProblem()));
    });
    $('newProblemBtn').addEventListener('click', () => {
      if (!currentLevel) return;
      goNextProblem();
    });
  })();
  </script>
</body>
</html>

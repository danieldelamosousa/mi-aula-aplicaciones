<script>
"use strict";

const random = (min,max) => Math.floor(Math.random() * (max-min+1)) + min;
const pick = items => items[random(0,items.length-1)];
const format = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f");
const times = (a,b) => `${format(a)} × ${format(b)}`;
const product = (a,b) => `${times(a,b)} = ${format(a*b)}`;
const sumOfGroups = (groups,size) => Array(groups).fill(String(size)).join(" + ");
const numeric = (label,answer) => ({label,answer});
const shuffle = items => {
  const copy = [...items];
  for (let i=copy.length-1;i>0;i--) {
    const j = random(0,i);
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
};

function choose(prompt,display,answer,alternatives,hint,explanation,visual) {
  return {
    prompt,display,hint,explanation,visual,answer,
    options:shuffle([...new Set([answer,...alternatives])])
  };
}

function write(prompt,display,fields,hint,explanation,visual) {
  return {prompt,display,fields,hint,explanation,visual};
}

function groups() {
  const size=random(2,8), count=random(2,5);
  const repeated=sumOfGroups(count,size);
  const reversed=size===count ? null : times(count,size);
  const exercise=choose("¿Qué multiplicación representa esta suma?",repeated,times(size,count),
    [times(size+1,count),times(size,count+1),reversed ?? `${size} + ${count}`],
    "Primero escribe el número que se repite. Después, cuántas veces aparece.",
    `Hay ${count} grupos de ${size}. ${repeated} = ${product(size,count)}.`,
    {type:"dots",count,size});
  return {...exercise,reversed};
}

function factorNames() {
  const a=random(2,9), b=random(2,9);
  const answer=pick(["El producto","Un factor"]);
  const highlighted=answer==="El producto" ? a*b : pick([a,b]);
  return choose(`¿Qué nombre recibe el ${highlighted} en esta multiplicación?`,product(a,b),answer,
    ["El producto","Un factor","Un sumando"],
    "Los números que multiplicamos son factores. El resultado es el producto.",
    `${a} y ${b} son los factores. ${a*b} es el producto.`);
}

function tables(tablesSet) {
  const size=pick(tablesSet), count=random(0,10);
  const hints={
    2:"Cuenta de dos en dos tantas veces como indica el segundo factor.",
    4:"Calcula primero por 2 y dobla el resultado.",
    5:"Cuenta de cinco en cinco. Los resultados terminan en 0 o en 5.",
    8:"Calcula primero por 4 y dobla el resultado.",
    10:"Cada grupo aporta una decena."
  };
  const hint=count===0?"Cero grupos aportan cero elementos.":(hints[size]||`Piensa en ${count} grupos de ${size}.`);
  return write("Calcula el producto.",`${times(size,count)} = ?`,[numeric("Resultado",size*count)],
    hint,`${product(size,count)}.`);
}

function series(stepSet) {
  const step=pick(stepSet), start=random(0,5), empty=random(1,3);
  const values=Array.from({length:5},(_,i)=>(start+i)*step);
  return write("Escribe el número que falta.",values.map((n,i)=>i===empty?"?":n).join(" · "),
    [numeric("Número",values[empty])],`En cada salto se suma ${step}. Mira el número anterior al hueco.`,
    `${values[empty-1]} + ${step} = ${values[empty]}.`);
}

function evenOrOdd() {
  const a=random(0,10), extra=random(0,1), n=a*2+extra;
  const shown=extra ? `(${times(2,a)}) + 1 = ${n}` : product(2,a);
  return choose("¿El resultado es par o impar?",shown,extra?"Impar":"Par",["Par","Impar"],
    "Un número par puede repartirse en parejas sin que sobre ningún elemento.",
    extra ? `${n} es impar. Al añadir uno al número par ${a*2}, queda un elemento sin pareja.`
      : `${n} es par. Todos los resultados de la tabla del 2 son pares, incluido el 0.`);
}

function zero() {
  const a=random(2,10);
  const [left,right]=pick([[a,0],[0,a]]);
  return write("¿Qué ocurre al multiplicar por cero?",`${times(left,right)} = ?`,
    [numeric("Producto",0)],"Imagina grupos con cero objetos en cada uno o que tienes cero grupos.",
    `${product(left,right)}. Si uno de los factores es 0, el producto es 0.`);
}

function double() {
  const a=random(2,32), b=a*2;
  return write(`¿Cuál es el doble de ${a}?`,`${a} + ${a} = ?`,[numeric("Doble",b)],
    "Suma el mismo número dos veces.",`${a} + ${a} = ${product(a,2)}.`);
}

function doublesInTables(halfSet) {
  const b=pick(halfSet), a=random(2,10);
  return write("Usa el doble del resultado para completar la segunda multiplicación.",
    `${product(b,a)} · ${times(2*b,a)} = ?`,[numeric("Producto",2*a*b)],
    `Si un factor se dobla, el resultado también se dobla. Suma ${a*b} dos veces.`,
    `El doble de ${a*b} es ${2*a*b}. ${product(2*b,a)}.`);
}

function compare() {
  const a=random(2,10), b=pick([2,4,5,8,10]);
  const d=pick([2,4,5,8,10]);
  const c=pick([Math.min(10,Math.max(1,Math.round(a*b/d))),random(1,10)]);
  const left=a*b, right=c*d;
  const answer=left===right?"=":left<right?"<":">";
  return choose("Compara los dos productos.",`${times(b,a)} ? ${times(d,c)}`,answer,["<","=",">"],
    "Calcula cada multiplicación por separado. Compara los resultados.",
    `A la izquierda sale ${left} y a la derecha sale ${right}. ${left} ${answer} ${right}.`);
}

function problem3() {

  ]);

}

function pythagorean() {

function commutative() {
  const a=random(2,10), b=pick(Array.from({length:9},(_,i)=>i+2).filter(n=>n!==a));
  return write("Cambia el orden de los factores. Escribe el número que falta.",
    `${times(a,b)} = ${b} × ?`,[numeric("Factor",a)],
    "Puedes intercambiar los factores y el producto se conserva.",
    `${times(a,b)} = ${product(b,a)}. Es la propiedad conmutativa.`);
}

function associative() {
  const a=random(2,8), b=random(2,6), c=random(2,5);
  const factorFirst=pick([true,false]);
  const display=factorFirst
    ? `(${times(a,b)}) × ${c} = ${a} × (? × ${c})`
    : `${a} × (${times(b,c)}) = (${a} × ?) × ${c}`;
  return write("Cambia la agrupación. Escribe el factor que falta.",display,[numeric("Factor",b)],
    "Los tres factores siguen en el mismo orden. Solo cambian los paréntesis.",
    `(${times(a,b)}) × ${c} = ${a} × (${times(b,c)}) = ${a*b*c}. Es la propiedad asociativa.`);
}

function order() {
  const a=random(2,12), b=random(2,9), c=random(2,8);
  const tasks=[
    [`${a} + ${times(b,c)}`,a+b*c,`Primero multiplica ${times(b,c)}. Después suma ${a}.`,`${a} + ${b*c}`],
    [`(${a} + ${b}) × ${c}`,(a+b)*c,"Resuelve primero lo que está entre paréntesis.",times(a+b,c)],
    [`${times(a,b)} − ${c}`,a*b-c,"Haz primero la multiplicación. Luego resta.",`${a*b} − ${c}`],
    [`${c} × (${a+b} − ${b})`,c*a,"Resuelve primero la resta que está entre paréntesis.",times(c,a)]
  ];
  const [expression,answer,hint,step]=pick(tasks.filter(task=>task[1]>=0));
  return write("Resuelve la operación siguiendo el orden correcto.",`${expression} = ?`,
    [numeric("Resultado",answer)],hint,`${expression} = ${step} = ${answer}.`);
}

function distributive(sign) {
  const a=random(2,8), b=random(4,12), c=sign==="+"?random(2,8):random(1,b-1);
  const total=a*(sign==="+"?b+c:b-c);
  return write("Multiplica por separado y completa los dos productos y el resultado.",
    `${a} × (${b} ${sign} ${c}) = ${times(a,b)} ${sign} ${times(a,c)}`,
    [numeric("Primer producto",a*b),numeric("Segundo producto",a*c),numeric("Resultado",total)],
    `Multiplica ${a} por ${b} y ${a} por ${c}. Después ${sign==="+"?"suma":"resta"} los dos productos.`,
    `${a*b} ${sign} ${a*c} = ${total}.`);
}

function powers(pure) {
  const a=random(2,178), exponent=random(1,3), digit=pure?1:random(2,9);
  const b=digit*10**exponent;
  return write("Calcula la multiplicación.",`${times(a,b)} = ?`,[numeric("Resultado",a*b)],
    pure?`Multiplica por ${format(b)} añadiendo ${exponent} ${exponent===1?"cero":"ceros"} al final del número.`
      :`Multiplica ${a} por ${digit}. Después añade ${exponent} ${exponent===1?"cero":"ceros"} al resultado.`,
    pure?`${product(a,b)}.`:`${times(a,digit)} = ${format(a*digit)}. ${product(a,b)}.`);
}

function vertical(digitCount,guided) {
  const a=random(digitCount===1?24:31,digitCount===1?4295:digitCount===2?920:520);
  const b=digitCount===1 ? random(2,9) : digitCount===2 ? random(12,98) : random(105,498);
  const digits=String(b).split("").reverse().map(Number);
  const placeNames=["unidades","decenas","centenas"];
  const partial=digits.map((d,i)=>a*d*10**i);
  const fields=guided ? partial.map((n,i)=>numeric(`Parcial de ${placeNames[i]}`,n)) : [];
  fields.push(numeric("Producto final",a*b));
  const visual={type:"vertical",a,b};
  const hint=digitCount===1
    ? "Multiplica de derecha a izquierda. Si obtienes 10 o más, escribe la cifra de las unidades y lleva las decenas a la columna siguiente."
    : `Calcula un producto parcial por cada cifra de abajo. El de las decenas vale × 10${digitCount===3?" y el de las centenas vale × 100":""}. Suma los parciales.`;
  const explanation=digitCount===1 ? `${product(a,b)}.`
    : `${a} × (${digits.map((d,i)=>format(d*10**i)).reverse().join(" + ")}) = ${partial.map(format).reverse().join(" + ")} = ${format(a*b)}.`;
  return write("Resuelve la multiplicación en vertical.","",fields,hint,explanation,visual);
}

function problem4() {
  const a=random(112,410), b=pick([random(12,35),random(101,145)]);
  const [prompt,unit]=pick([
    [`Un depósito tiene ${a} litros de agua. ¿Cuántos litros tienen ${b} depósitos iguales?`,"Litros"],
    [`El almacén prepara ${b} lotes de ${a} botellas cada uno. ¿Cuántas botellas hay?`,"Botellas"],
    [`Un huerto recoge ${a} litros de agua de lluvia cada semana. ¿Cuántos litros recoge en ${b} semanas si la cantidad es siempre la misma?`,"Litros"]
  ]);
  return write(prompt,"",[numeric(unit,a*b)],
    "Multiplica lo que hay en un grupo por el número de grupos. Puedes colocar la operación en vertical.",
    `${product(a,b)} ${unit.toLowerCase()}.`);
}

const byId = id => document.getElementById(id);
const tabsElement = byId("tabs");
const grades = [...document.querySelectorAll(".grade-btn")];
const mode = byId("mode");
const answers = byId("answers");
const question = byId("question");
const visual = byId("visual");
const feedback = byId("feedback");
const hint = byId("hint");
const hintButton = byId("hint-btn");
const checkButton = byId("check");
const nextButton = byId("next");

const makeState = () => ({
  selectedTab:0,
  tabs:[]
});
const gradeState = {3:makeState(),4:makeState()};
let grade = null;

function activeTopic() {
  return courses[grade].tabs[gradeState[grade].selectedTab];
}

function activeProgress() {
  const state = gradeState[grade];
  return state.tabs[state.selectedTab] ??= {
    total:0, mode:"all", mix:[], round:null
  };
}

function makeRound(progress) {
  const activities = activeTopic().activities;
  if (progress.mode==="all" && !progress.mix.length) {
    progress.mix=activities.map((_,i)=>i);
  }
  const activity = activities[progress.mode==="all" ? progress.mix.shift() : Number(progress.mode)];
  const previous = progress.round?.exercise;
  let exercise = activity.make();
  for (let tries=0; tries<6 && previous && exercise.prompt===previous.prompt &&
    exercise.display===previous.display && exercise.visual?.a===previous.visual?.a &&
    exercise.visual?.b===previous.visual?.b; tries++) {
    exercise=activity.make();
  }
  const topic = `${grade}.º · ${activeTopic().title}`;
  const operation = exercise.visual?.type === "vertical"
    ? times(exercise.visual.a, exercise.visual.b) : exercise.display;
  window.Aula?.begin(topic, [exercise.prompt, operation].filter(Boolean).join(" · "), activity.name);
  progress.round = {
    exercise, topic, values:[], activeField:0, selected:null, wrong:[],
    hintOpen:false, solved:false, message:"", tone:""
  };
}

function node(tag,className,text) {
  const item=document.createElement(tag);
  if (className) item.className=className;
  if (text!==undefined) item.textContent=text;
  return item;
}

function setGrade(nextGrade) {
  grade=nextGrade;
  document.body.dataset.grade=grade;
  byId("unit").textContent=`Unidad 3 · ${grade}.º de Primaria`;
  byId("unit-note").textContent=`${courses[grade].name} · Elige un contenido y practica a tu ritmo.`;
  grades.forEach(button=>button.setAttribute("aria-pressed",Number(button.dataset.grade)===grade));
  renderTabs();
  renderTopic();
}

function renderTabs() {
  const buttons = courses[grade].tabs.map((tab,index)=>{
    const button=node("button","tab");
    button.type="button";
    button.id=`tab-${grade}-${index}`;
    button.setAttribute("role","tab");
    button.setAttribute("aria-controls","exercise");
    const icon=node("span","tab-icon",tab.icon);
    icon.setAttribute("aria-hidden","true");
    button.append(icon,node("span","tab-name",tab.title),node("span","tab-count"));
    button.addEventListener("click",()=>selectTopic(index));
    button.addEventListener("keydown",event=>{
      const offsets={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1};
      const count=courses[grade].tabs.length;
      const target=event.key==="Home" ? 0 : event.key==="End" ? count-1
        : event.key in offsets ? (index+offsets[event.key]+count)%count : null;
      if (target===null) return;
      event.preventDefault();
      selectTopic(target);
      tabsElement.children[target].focus();
    });
    return button;
  });
  tabsElement.replaceChildren(...buttons);
  updateTabLabels();
}

function updateTabLabels() {
  const state=gradeState[grade];
  [...tabsElement.children].forEach((button,index)=>{
    const active=index===state.selectedTab;
    const count=state.tabs[index]?.total ?? 0;
    button.tabIndex=active ? 0 : -1;
    button.setAttribute("aria-selected",active);
    const countLabel=button.lastElementChild;
    countLabel.textContent=count ? `✓ ${count}` : "";
    countLabel.setAttribute("aria-hidden","true");
    button.setAttribute("aria-label",count ? `${courses[grade].tabs[index].title}, ${count} ${count===1?"acierto":"aciertos"}` : courses[grade].tabs[index].title);
  });
}

function selectTopic(index) {
  if (gradeState[grade].selectedTab===index) return;
  gradeState[grade].selectedTab=index;
  updateTabLabels();
  renderTopic();
}

function renderTopic() {
  const current=activeTopic();
  const progress=activeProgress();
  byId("exercise").setAttribute("aria-labelledby",tabsElement.children[gradeState[grade].selectedTab].id);
  byId("topic").textContent=current.title;
  byId("topic-meta").textContent=`Libro · ${current.pages}`;
  const options=current.activities.map((item,i)=>new Option(item.name,String(i)));
  if (options.length>1) options.unshift(new Option("Tipos de reto variados","all"));
  mode.replaceChildren(...options);
  if (options.length===1) progress.mode="0";
  mode.value=progress.mode;
  if (!progress.round) makeRound(progress);
  renderRound();
}

function updateScore() {
  const n=activeProgress().total;
  byId("score").textContent=`${n} ${n===1?"acierto":"aciertos"}`;
}

function renderRound() {
  const round=activeProgress().round;
  const exercise=round.exercise;
  window.Aula?.activate(round.topic);
  question.textContent=exercise.prompt;
  visual.replaceChildren();
  answers.replaceChildren();
  if (exercise.display) visual.append(node("div","display",exercise.display));
  if (exercise.visual?.type==="dots") drawDots(exercise.visual);
  if (exercise.visual?.type==="vertical") drawVertical(exercise.visual);
  if (exercise.visual?.type==="table") drawPythagorean(round);
  if (exercise.options) {
    const grid=node("div","answer-grid");
    exercise.options.forEach(value=>grid.append(choiceButton(value,value,"option",round)));
    answers.append(grid);
  }
  if (exercise.fields) drawFields(round);
  updateRoundControls();
  updateScore();
}

function drawDots({count,size}) {
  const dots=node("div","dots");
  dots.setAttribute("role","img");
  dots.setAttribute("aria-label",`${count} grupos de ${size} cuadrados cada uno`);
  for (let i=0;i<count;i++) {
    const group=node("span","dot-group");
    for (let n=0;n<size;n++) group.append(node("span","dot"));
    dots.append(group);
  }
  visual.append(dots);
}

function drawVertical({a,b}) {
  const work=node("div","number-work");
  work.setAttribute("role","img");
  work.setAttribute("aria-label",times(a,b));
  work.append(node("span","",a),node("span","",`× ${b}`));
  visual.append(work);
}

function drawPythagorean(round) {
  const wrapper=node("div","table-wrapper");
  const table=node("table","pythagorean");
  const caption=node("caption","sr-only","Tabla pitagórica del 1 al 10");
  const header=node("thead");
  const headRow=node("tr");
  headRow.append(node("th","","×"));
  for (let n=1;n<=10;n++) {
    const th=node("th","",n);
    th.scope="col";
    headRow.append(th);
  }
  header.append(headRow);
  const body=node("tbody");
  for (let row=1;row<=10;row++) {
    const tr=node("tr"), heading=node("th","",row);
    heading.scope="row";
    tr.append(heading);
    for (let col=1;col<=10;col++) {
      const cell=node("td");
      const button=choiceButton(`${row}-${col}`,String(row*col),"cell",round);
      button.setAttribute("aria-label",`Fila ${row}, columna ${col}, producto ${row*col}`);
      tr.append(cell);
      cell.append(button);
    }
    body.append(tr);
  }
  table.append(caption,header,body);
  wrapper.append(table);
  answers.append(wrapper);
}

function choiceButton(value,label,className,round) {
  const button=node("button",className,label);
  button.type="button";
  button.dataset.value=value;
  button.addEventListener("click",()=>{
    if (round.solved) return;
    round.selected=value;
    round.wrong=[];
    round.message="";
    updateRoundControls();
  });
  return button;
}

function drawFields(round) {
  const workspace=node("div","numeric-workspace");
  const fields=node("div","fields");
  const inputs=round.exercise.fields.map((field,index)=>{
    const label=node("label","answer-field");
    const input=node("input","answer-input");
    input.type="text";
    input.inputMode="none";
    input.autocomplete="off";
    input.spellcheck=false;
    input.maxLength=14;
    input.value=round.values[index] ?? "";
    input.addEventListener("focus",()=>{
      round.activeField=index;
      updateRoundControls();
    });
    input.addEventListener("input",()=>setFieldValue(round,index,input,input.value));
    label.append(node("span","",field.label),input);
    fields.append(label);
    return input;
  });
  workspace.append(fields,drawKeypad(round,inputs));
  answers.append(workspace);
}

function setFieldValue(round,index,input,value) {
  if (round.solved || round.values[index]===value) return;
  if (input.value!==value) input.value=value;
  round.values[index]=value;
  round.wrong=round.wrong.filter(item=>item!==index);
  round.message="";
  updateRoundControls();
}

function drawKeypad(round,inputs) {
  const keypad=node("div","keypad");
  keypad.setAttribute("role","group");
  keypad.setAttribute("aria-label","Teclado de calculadora");
  if (inputs.length>1) {
    const target=node("p","keypad-target");
    target.setAttribute("aria-live","polite");
    keypad.append(target);
  }
  const keys=["7","8","9","4","5","6","1","2","3","C","0","⌫"];
  for (const key of keys) {
    const label={C:"Borrar todo","⌫":"Borrar la última cifra"}[key];
    const button=node("button",label?"keypad-key is-utility":"keypad-key",key);
    button.type="button";
    if (label) {
      button.setAttribute("aria-label",label);
      button.title=label;
    }
    button.addEventListener("click",()=>{
      const index=round.activeField;
      const input=inputs[index];
      const current=input.value;
      const value=key==="C" ? "" : key==="⌫" ? current.slice(0,-1) : (current+key).slice(0,input.maxLength);
      setFieldValue(round,index,input,value);
    });
    keypad.append(button);
  }
  if (inputs.length>1) {
    const next=node("button","keypad-key keypad-next","Siguiente casilla");
    next.type="button";
    next.addEventListener("click",()=>inputs[(round.activeField+1)%inputs.length].focus());
    keypad.append(next);
  }
  return keypad;
}

function updateRoundControls() {
  const round=activeProgress().round;
  answers.querySelectorAll("button[data-value]").forEach(button=>{
    const selected=button.dataset.value===round.selected;
    button.setAttribute("aria-pressed",selected);
    button.classList.toggle("is-right",selected && round.solved);
    button.classList.toggle("is-wrong",selected && round.wrong.length>0);
    button.disabled=round.solved;
  });
  answers.querySelectorAll("input").forEach((input,index)=>{
    input.readOnly=round.solved;
    input.classList.toggle("is-active",index===round.activeField);
    input.setAttribute("aria-invalid",round.wrong.includes(index));
  });
  answers.querySelectorAll(".keypad-key").forEach(button=>{button.disabled=round.solved;});
  const target=answers.querySelector(".keypad-target");
  if (target) {
    const text=`Casilla activa · ${round.exercise.fields[round.activeField].label}`;
    if (target.textContent!==text) target.textContent=text;
  }
  feedback.className=`feedback ${round.tone}`;
  if (feedback.textContent!==round.message) feedback.textContent=round.message;
  const hintText=round.hintOpen ? round.exercise.hint : "";
  if (hint.textContent!==hintText) hint.textContent=hintText;
  hintButton.setAttribute("aria-expanded",round.hintOpen);
  hintButton.textContent=round.hintOpen ? "Ocultar pista" : "Ver pista";
  checkButton.hidden=round.solved;
  nextButton.textContent=round.solved ? "Siguiente reto" : "Otro reto";
}

function parseAnswer(raw) {
  const value=String(raw ?? "").trim();
  if (!/^(?:\d+|\d{1,3}(?:[.\s]\d{3})+)$/u.test(value)) return null;
  return Number(value.replace(/[.\s]/gu,""));
}

function checkAnswer(event) {
  event.preventDefault();
  const progress=activeProgress(), round=progress.round;
  if (round.solved) return;
  const exercise=round.exercise;
  let message;
  let submitted;
  if (exercise.fields) {
    const parsed=exercise.fields.map((_,i)=>parseAnswer(round.values[i]));
    if (parsed.includes(null)) {
      round.wrong=parsed.flatMap((value,index)=>value===null?[index]:[]);
      message=parsed.some((value,i)=>value===null && String(round.values[i] ?? "").trim())
        ? "Escribe números enteros en las casillas marcadas."
        : "Completa todas las casillas para comprobar.";
    } else {
      round.wrong=exercise.fields.flatMap((field,i)=>field.answer===parsed[i]?[]:[i]);
      submitted = exercise.fields.map((field, i) => `${field.label}: ${parsed[i]}`).join(" · ");
    }
  } else {
    if (round.selected===null) message="Selecciona una respuesta para comprobar.";
    if (round.selected !== null) {
      submitted = String(round.selected);
      if (exercise.visual?.type === "table") {
        const [row, column] = submitted.split("-");
        submitted = `Fila ${row}, columna ${column} (${Number(row) * Number(column)})`;
      }
    }
    round.wrong=round.selected!==null && round.selected!==exercise.answer ? [0] : [];
    if (exercise.reversed && round.selected===exercise.reversed) {
      message="El producto coincide. Para representar esa suma, escribe primero el número que se repite.";
    }
  }
  if (submitted !== undefined) window.Aula?.attempt(round.topic, !message && !round.wrong.length, submitted);
  if (message || round.wrong.length) {
    round.tone="try";
    round.message=message ?? (exercise.fields?.length>1
      ? "Revisa los resultados de las casillas marcadas. Puedes mirar la pista."
      : "Prueba otra vez. Si te hace falta, abre la pista.");
  } else {
    round.solved=true;
    round.tone="good";
    round.message=`¡Correcto! ${exercise.explanation}`;
    progress.total++;
    updateScore();
    updateTabLabels();
  }
  updateRoundControls();
  if (round.solved) nextButton.focus();
  else if (message && exercise.fields) answers.querySelectorAll("input")[round.wrong[0]]?.focus();
}

function nextRound() {
  makeRound(activeProgress());
  renderRound();
  question.focus();
}

document.querySelectorAll(".welcome-course").forEach(button=>button.addEventListener("click",()=>{
  setGrade(Number(button.dataset.grade));
  byId("welcome").hidden=true;
  byId("practice-header").hidden=false;
  byId("practice").hidden=false;
  window.scrollTo(0,0);
  byId("title").focus({preventScroll:true});
}));
grades.forEach(button=>button.addEventListener("click",()=>{
  if (Number(button.dataset.grade)!==grade) setGrade(Number(button.dataset.grade));
}));
mode.addEventListener("change",()=>{
  const progress=activeProgress();
  progress.mode=mode.value;
  if (mode.value==="all") progress.mix=[];
  makeRound(progress);
  renderRound();
});
byId("form").addEventListener("submit",checkAnswer);
hintButton.addEventListener("click",()=>{
  const round=activeProgress().round;
  round.hintOpen=!round.hintOpen;
  if (round.hintOpen) window.Aula?.hint(round.topic);
  updateRoundControls();
});
nextButton.addEventListener("click",nextRound);
byId("welcome").hidden=false;
</script>
</body>
</html>

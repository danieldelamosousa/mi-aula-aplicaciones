<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#143833">
  <title>Página no encontrada · Mi aula</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles/tokens.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .not-found-card {
      max-width: 480px;
      width: 100%;
      background: var(--surface, #fff);
      border: 1px solid var(--border-subtle, #dce4da);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(20, 56, 51, 0.08);
    }
    .nf-code {
      display: inline-block;
      font-family: var(--font-mono, ui-monospace, monospace);
      font-size: 13px;
      font-weight: 700;
      color: var(--primary, #1a6456);
      background: #e6f2ec;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.7rem;
      margin: 0 0 10px;
      color: var(--ink, #143833);
    }
    p {
      margin: 0 0 22px;
      color: var(--ink-secondary, #49605b);
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main class="not-found-card">
    <span class="nf-code">Error 404</span>
    <h1>No encontramos esta página</h1>
    <p>Puede que el enlace haya cambiado o que la dirección tenga algún error. Vuelve al portal para elegir tu actividad.</p>
    <a class="btn btn-primary" href="/">← Volver a Mi aula</a>
  </main>
</body>
</html>
